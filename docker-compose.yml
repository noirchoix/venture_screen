services:
  api:
    build: ./apps/api
    environment:
      VSI_ENVIRONMENT: production
      VSI_DATA_DIR: /data
      VSI_CORS_ORIGINS: http://localhost:5173
    volumes:
      - vsi_data:/data
    ports:
      - "8000:8000"
  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./apps/web:/app
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on: [api]
volumes:
  vsi_data:
